name: 安卓安装包

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 准备网页文件
        run: |
          mkdir -p www
          cp index.html app.css app.js manifest.json icon-180.png icon-192.png icon-512.png www/

      - name: 生成安卓工程
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android

      - name: 图标、版本号、签名
        run: |
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in $RES/mipmap-*; do
            cp icon-192.png $d/ic_launcher.png
            cp icon-192.png $d/ic_launcher_round.png
            rm -f $d/ic_launcher_foreground.png
          done
          mkdir -p $RES/drawable
          cp android-build/ic_stat_notify.xml $RES/drawable/ic_stat_notify.xml
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "version" android/app/build.gradle
          mkdir -p ~/.android
          cp android-build/debug.keystore ~/.android/debug.keystore

      - name: 打包
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -q

      - name: 发布到 Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk zhukebu.apk
          gh release delete latest -y --cleanup-tag || true
          gh release create latest zhukebu.apk \
            --title "住客簿 安卓版 1.${{ github.run_number }}" \
            --notes "下载 zhukebu.apk，在手机上直接安装；覆盖安装不会丢数据。" \
            --latest
