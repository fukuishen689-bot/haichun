<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>住客簿 · 海春暖院</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="住客簿">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f3f2ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141a19" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
 <div class="top-in">
  <div class="brand"><b>住客簿</b><span>海春暖院</span></div>
  <span class="chip" id="offlineChip">本机保存</span>
  <button type="button" class="pri" id="newBtn">新建登记</button>
 </div>
 <nav class="tabs" id="tabs" aria-label="页面">
  <button type="button" data-tab="today" aria-current="page">今日安排</button>
  <button type="button" data-tab="ledger">预订台账</button>
  <button type="button" data-tab="calendar">房态日历</button>
  <button type="button" data-tab="stats">经营概览</button>
  <button type="button" data-tab="backup">备份与导出</button>
 </nav>
</header>
<main class="wrap" id="view"><p class="muted">正在打开本机资料…</p></main>
<dialog id="editor" aria-label="登记"></dialog>
<dialog id="detail" aria-label="登记详情"></dialog>
<div class="toast" id="toast" role="status" hidden></div>
<script src="app.js"></script>
</body>
</html>
